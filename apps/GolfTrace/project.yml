name: GolfTrace
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
schemes:
  GolfTrace:
    build:
      targets:
        GolfTrace: all
        GolfTraceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GolfTraceTests
      environmentVariables:
        GOLFTRACE_LIVE_MCP_URL: "$(GOLFTRACE_LIVE_MCP_URL)"
        GOLFTRACE_VALIDATION_VIDEO_DIR: "$(GOLFTRACE_VALIDATION_VIDEO_DIR)"
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
targets:
  GolfTrace:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources
      - path: ../Shared
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bda.golftrace
        PRODUCT_NAME: GolfTrace
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/GolfTrace.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "25"
  GolfTraceTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests
    dependencies:
      - target: GolfTrace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bda.golftrace.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
